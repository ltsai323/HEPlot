figNAME: 'outputs/compFitRes.pdf'
upperpad:
  xLABEL: ''
  yLABEL: 'Entries'
  yRANGE:
    - 1e-1
    - 1e8
  ySCALE: log
  plotables:
    - type: TH1F
      objname: SBbtag_postfit/data
      file: secondary_plotable.root
      label: sideband data
      plotstyle: data0
      legorder: -1
    # the foramt is controlled in each DrawObj.py
    - type: TH1F
      objname: SBbtag_postfit/fit
      file: secondary_plotable.root
      label: total fit (L+C+B)
      plotstyle: line1
      legorder: 0
    - type: TH1F
      objname: SBbtag_postfit/bjet
      file: secondary_plotable.root
      label: B jet
      plotstyle: hist3
      legorder: 3
    - type: TH1F
      objname: SBbtag_postfit/sign
      file: secondary_plotable.root
      label: B+C jet
      plotstyle: hist2
      legorder: 2
lowerpad:
  xLABEL: 'bScore'
  yLABEL: 'data / MC'
  yRANGE:
    -  -0.01
    -   2.5
  # the foramt is controlled in each DrawObj.py
  plotables:
    - type: TGraphAsymmError
      objname: SBbtag_postfit/fit_ratio
      file: secondary_plotable.root
      label: 'data / MC'
      plotstyle: data0
