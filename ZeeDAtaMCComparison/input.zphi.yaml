figNAME: 'outputs/zphi.pdf'
upperpad:
  xLABEL: ''
  yLABEL: 'Entries'
  yRANGE:
    - 1e-0
    - 1e4
  ySCALE: linear
  plotables:
    - type: TH1F
      objname: data_zphi
      file: output.root
      label: data
      plotstyle: data0
      legorder: -1
    # the foramt is controlled in each DrawObj.py
    - type: TH1F
      objname: sign_zphi
      file: output.root
      label: Z+jet
      plotstyle: hist1
      legorder: 0
lowerpad:
  xLABEL: '$\phi^{Z}$'
  yLABEL: 'data / MC'
  yRANGE:
    -   0.1
    -   1.5
  # the foramt is controlled in each DrawObj.py
  plotables:
    - type: TGraphAsymmError
      objname: ratio_zphi
      file: output.root
      label: 'original'
      plotstyle: data
