figNAME: 'outputs/jetmass_datacorr.pdf'
upperpad:
  xLABEL: ''
  yLABEL: 'Entries'
  yRANGE:
    - 1e-0
    - 1e8
  ySCALE: log
  plotables:
    - type: TH1F
      objname: data_jetmass
      file: output.root
      label: JEC corrected
      plotstyle: data0
      legorder: -1
    # the foramt is controlled in each DrawObj.py
    - type: TH1F
      objname: data_jetmass_raw
      file: output.root
      label: raw data
      plotstyle: hist1
      legorder: 0
lowerpad:
  xLABEL: 'jet mass (GeV)'
  yLABEL: 'corr / raw'
  yRANGE:
    -   0.1
    -   2.0
  # the foramt is controlled in each DrawObj.py
  plotables:
    - type: TGraphAsymmError
      objname: ratio_jetmass_datacorr
      file: output.root
      label: 'original'
      plotstyle: data
