figNAME: 'outputs/{var}.pdf'
upperpad:
  xLABEL: ''
  yLABEL: 'Entries'
  yRANGE:
    - 1e-0
    - 1e10
  ySCALE: log
  plotables:
    - type: TH1F
      objname: {var}_postfit/data
      file: {inFILE}
      label: data
      plotstyle: data0
      legorder: -1
    # the foramt is controlled in each DrawObj.py
    - type: TH1F
      objname: {var}_postfit/fit
      file: {inFILE}
      label: {var}+di-jet
      plotstyle: line1
      legorder: 0
    - type: TH1F
      objname: {var}_postfit/bjet
      file: {inFILE}
      label: B jet
      plotstyle: hist3
      legorder: 3
    - type: TH1F
      objname: {var}_postfit/sign
      file: {inFILE}
      label: B+C jet
      plotstyle: hist2
      legorder: 2
lowerpad:
  xLABEL: '{xTITLE}'
  yLABEL: 'data / MC'
  yRANGE:
    -   0.2
    -   1.8
  # the foramt is controlled in each DrawObj.py
  plotables:
    - type: TGraphAsymmError
      objname: {var}_postfit/fit_ratio
      file: {inFILE}
      label: 'data / MC'
      plotstyle: data0
