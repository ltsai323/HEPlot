figNAME: 'outputs/hcheck_binconsistency_effB_WPcLoose.pdf'
yLABEL: '$\epsilon_{b}$ @ WPc Loose'
yRANGE:
  - -0.1
  - 1.2
ySCALE: linear
#yRANGE:
#  - 0.0
#  - 1.0
#ySCALE: linear
xLABEL: '$p^{\gamma}_{T}$ (GeV)'
plotables:
  # the foramt is controlled in each DrawObj.py
  - type: TGraphAsymmError
    objname: bin00B_WPcL_eff
    file: WPeff_2022GJetMadgraph.root
    label: 'barrel photon, barrel jet'
    plotstyle: data1
  - type: TGraphAsymmError
    objname: bin01B_WPcL_eff
    file: WPeff_2022GJetMadgraph.root
    label: 'barrel photon, endcap jet'
    plotstyle: data2
  - type: TGraphAsymmError
    objname: bin10B_WPcL_eff
    file: WPeff_2022GJetMadgraph.root
    label: 'endcap photon, barrel jet'
    plotstyle: data3
  - type: TGraphAsymmError
    objname: bin11B_WPcL_eff
    file: WPeff_2022GJetMadgraph.root
    label: 'endcap photon, endcap jet'
    plotstyle: data4
