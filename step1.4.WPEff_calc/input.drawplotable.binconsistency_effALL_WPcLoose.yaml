figNAME: 'outputs/hcheck_binconsistency_effAll_WPcLoose.pdf'
yLABEL: 'efficiencies @ WPc Loose'
yRANGE:
  - -0.1
  - 2.0
ySCALE: linear
#yRANGE:
#  - 0.0
#  - 1.0
#ySCALE: linear
xLABEL: '$p^{\gamma}_{T}$ (GeV)'
legNcolumn: 3
legFONTsize: 'xx-small'

plotables:
  # B efficiency
  - type: TGraphAsymmError
    objname: bin00B_WPcL_eff
    file: WPeff.root
    label: 'eff B @ bin00'
    plotstyle: star2
  - type: TGraphAsymmError
    objname: bin01B_WPcL_eff
    file: WPeff.root
    label: 'eff B @ bin01'
    plotstyle: cross2
  - type: TGraphAsymmError
    objname: bin10B_WPcL_eff
    file: WPeff.root
    label: 'eff B @ bin10'
    plotstyle: square2
  - type: TGraphAsymmError
    objname: bin11B_WPcL_eff
    file: WPeff.root
    label: 'eff B @ bin11'
    plotstyle: diamond2

  # C efficiency
  - type: TGraphAsymmError
    objname: bin00C_WPcL_eff
    file: WPeff.root
    label: 'eff C @ bin00'
    plotstyle: star3
  - type: TGraphAsymmError
    objname: bin01C_WPcL_eff
    file: WPeff.root
    label: 'eff C @ bin01'
    plotstyle: cross3
  - type: TGraphAsymmError
    objname: bin10C_WPcL_eff
    file: WPeff.root
    label: 'eff C @ bin10'
    plotstyle: square3
  - type: TGraphAsymmError
    objname: bin11C_WPcL_eff
    file: WPeff.root
    label: 'eff C @ bin11'
    plotstyle: diamond3

  # L efficiency
  - type: TGraphAsymmError
    objname: bin00L_WPcL_eff
    file: WPeff.root
    label: 'eff L @ bin00'
    plotstyle: star4
  - type: TGraphAsymmError
    objname: bin01L_WPcL_eff
    file: WPeff.root
    label: 'eff L @ bin01'
    plotstyle: cross4
  - type: TGraphAsymmError
    objname: bin10L_WPcL_eff
    file: WPeff.root
    label: 'eff L @ bin10'
    plotstyle: square4
  - type: TGraphAsymmError
    objname: bin11L_WPcL_eff
    file: WPeff.root
    label: 'eff L @ bin11'
    plotstyle: diamond4
