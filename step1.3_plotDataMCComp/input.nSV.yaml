figNAME: 'outputs/nSV.pdf'
upperpad:
  xLABEL: ''
  yLABEL: 'Entries'
  yRANGE:
    - 1e-1
    - 1e8
  ySCALE: log
  plotables:
    - type: TH1F
      objname: data_svmultp
      file: o.root
      label: data
      plotstyle: data0
      legorder: -1
    # the foramt is controlled in each DrawObj.py
    - type: TH1F
      objname: fake_svmultp
      file: o.root
      label: QCD
      plotstyle: histBKG
      legorder: 1
    - type: TH1F
      objname: stak_svmultp
      file: o.root
      label: gjet Madgraph
      plotstyle: hist1
      legorder: 0
lowerpad:
  xLABEL: 'SV multiplicity'
  yLABEL: 'data / MC'
  yRANGE:
    -   0.0
    -   1.0
  # the foramt is controlled in each DrawObj.py
  plotables:
    - type: TGraphAsymmError
      objname: ratio_svmultp
      file: o.root
      label: 'original'
      plotstyle: data
