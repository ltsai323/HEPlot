figNAME: 'outputs/phophi.pdf'
upperpad:
  xLABEL: ''
  yLABEL: 'Entries'
  yRANGE:
    - 1e-1
    - 1e8
  ySCALE: log
  plotables:
    - type: TH1F
      objname: data_phophi
      file: o.root
      label: data
      plotstyle: data0
      legorder: -1
    # the foramt is controlled in each DrawObj.py
    - type: TH1F
      objname: fake_phophi
      file: o.root
      label: QCD
      plotstyle: histBKG
      legorder: 1
    - type: TH1F
      objname: stak_phophi
      file: o.root
      label: gjet Madgraph
      plotstyle: hist1
      legorder: 0
lowerpad:
  xLABEL: '$\phi^{\gamma}$'
  yLABEL: 'data / MC'
  yRANGE:
    -   0.9
    -   1.4
  # the foramt is controlled in each DrawObj.py
  plotables:
    - type: TGraphAsymmError
      objname: ratio_phophi
      file: o.root
      label: 'original'
      plotstyle: data
